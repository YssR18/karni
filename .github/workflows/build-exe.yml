name: Build KARNI Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/build-exe.yml"
      - "icon-*.png"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. تثبيت أدوات بناء الويندوز
        run: |
          npm init -y
          npm install --save-dev electron@32 electron-builder@25 sharp

      - name: 4. عزل ملفات التطبيق وتحويل الأيقونة إلى صيغة ICO للويندوز
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");

          function electronMain() {
            const { app, BrowserWindow, shell, ipcMain, dialog } = require("electron");
            const path = require("path");
            const fs = require("fs");
            const os = require("os");
            const LIVE = "https://yssr18.github.io/karni/";

            if (!app.requestSingleInstanceLock()) { app.quit(); return; }
            let win = null;

            // الخروج: تذكير بالنسخ الاحتياطي ثم تسجيل خروج وإغلاق (فيبدأ البرنامج في المرة القادمة من صفحة الدخول)
            let allowClose = false, asking = false;
            const TXT = {
              ar: { title: "تذكير بالنسخ الاحتياطي", msg: "لا تنسَ أخذ نسخة احتياطية من بياناتك قبل الخروج.", last: "آخر نسخة احتياطية: ", never: "لم تؤخذ نسخة بعد", note: "عند الخروج يُسجَّل خروجك، وسيفتح البرنامج على صفحة الدخول في المرة القادمة.", exit: "خروج", backup: "نسخة احتياطية الآن", cancel: "إلغاء" },
              fr: { title: "Rappel de sauvegarde", msg: "N oubliez pas de sauvegarder vos données avant de quitter.", last: "Dernière sauvegarde : ", never: "aucune sauvegarde", note: "En quittant, vous serez déconnecté ; le programme s ouvrira sur la page de connexion.", exit: "Quitter", backup: "Sauvegarder maintenant", cancel: "Annuler" },
              en: { title: "Backup reminder", msg: "Do not forget to back up your data before exiting.", last: "Last backup: ", never: "no backup yet", note: "On exit you will be signed out; the app will open on the login page next time.", exit: "Exit", backup: "Back up now", cancel: "Cancel" }
            };
            async function doExit() {
              try {
                await Promise.race([
                  win.webContents.executeJavaScript("(function () { try { if (typeof auth !== \"undefined\" && auth) return auth.signOut().then(function () { return 1; }); } catch (e) {} return 0; })()"),
                  new Promise((res) => setTimeout(res, 3000))
                ]);
              } catch (e) {}
              allowClose = true;
              win.close();
            }
            async function askExit() {
              // الأفضل: نافذة التطبيق نفسها (بثيم التطبيق)، وإن لم تتوفر ننتقل لنافذة النظام
              try {
                const r = await win.webContents.executeJavaScript("typeof desktopExitPrompt === \"function\" ? desktopExitPrompt() : null");
                if (r === "exit") { await doExit(); return; }
                if (typeof r === "string") return;
              } catch (e) {}
              let lang = "ar", last = "";
              try { lang = (await win.webContents.executeJavaScript("localStorage.getItem(\"app_lang\") || \"ar\"")) || "ar"; } catch (e) {}
              try { last = await win.webContents.executeJavaScript("localStorage.getItem(\"app_last_backup\") || \"\""); } catch (e) {}
              const t = TXT[lang] || TXT.ar;
              const when = last && Number(last) ? new Date(Number(last)).toLocaleString(lang === "ar" ? "ar-DZ" : lang) : t.never;
              const res = await dialog.showMessageBox(win, {
                type: "warning", title: "KARNI", message: t.title,
                detail: t.msg + "\n" + t.last + when + "\n\n" + t.note,
                buttons: [t.exit, t.backup, t.cancel], defaultId: 1, cancelId: 2, noLink: true
              });
              if (res.response === 1) {
                try { await win.webContents.executeJavaScript("typeof exportData === \"function\" && exportData()"); } catch (e) {}
                return;
              }
              if (res.response === 0) await doExit();
            }

            // الطباعة: نُنتج PDF (بمعاينة كاملة) ونفتحه في قارئ PDF بدل نافذة الطباعة الأصلية بلا معاينة
            const pdfOpts = { printBackground: true, pageSize: "A4", margins: { marginType: "default" } };
            async function savePdf(buf) {
              const file = path.join(os.tmpdir(), "KARNI-" + Date.now() + ".pdf");
              fs.writeFileSync(file, buf);
              const err = await shell.openPath(file);
              if (err) throw new Error(err);
              return true;
            }
            ipcMain.handle("karni-print-page", async (e) => savePdf(await e.sender.printToPDF(pdfOpts)));
            ipcMain.handle("karni-print-html", async (e, html) => {
              const w = new BrowserWindow({ show: false, webPreferences: { sandbox: true } });
              try {
                await w.loadURL("data:text/html;charset=utf-8," + encodeURIComponent(String(html)));
                return await savePdf(await w.webContents.printToPDF(pdfOpts));
              } finally { w.destroy(); }
            });

            ipcMain.handle("karni-printers", async (e) => {
              const list = await e.sender.getPrintersAsync();
              return list.map((p) => ({ name: p.name, isDefault: !!p.isDefault }));
            });
            ipcMain.handle("karni-print-sized", async (e, html, title, wMm, hMm, device) => {
              const pxW = Math.max(200, Math.round(Number(wMm) * 96 / 25.4));
              const w = new BrowserWindow({ show: false, width: pxW, height: 1200, useContentSize: true, webPreferences: { sandbox: true } });
              try {
                await w.loadURL("data:text/html;charset=utf-8," + encodeURIComponent(String(html)));
                try { await w.webContents.executeJavaScript("document.fonts && document.fonts.ready ? document.fonts.ready.then(function () { return true; }) : true"); } catch (e) {}
                await new Promise((r) => setTimeout(r, 600));
                let h = Number(hMm) || 0;
                if (!h) {
                  const px = await w.webContents.executeJavaScript("Math.ceil(document.body.getBoundingClientRect().height)");
                  h = Math.max(30, Math.ceil(px * 25.4 / 96) + 4);
                }
                const doPrint = (dev) => new Promise((resolve, reject) => {
                  const o = { silent: !!dev, printBackground: true, margins: { marginType: "none" } }; if (Number(hMm) > 0) o.pageSize = { width: Math.round(Number(wMm) * 1000), height: Math.round(h * 1000) };
                  if (dev) o.deviceName = dev;
                  w.webContents.print(o, (ok, why) => {
                    if (ok || why === "cancelled" || why === "Print job canceled") resolve(true); else reject(new Error(why || "print failed"));
                  });
                });
                try { return await doPrint(device || ""); }
                catch (err) { if (device) return await doPrint(""); throw err; }
              } finally { w.destroy(); }
            });

            const isInternal = (u) => u.startsWith(LIVE) || u.startsWith("file://") || u.startsWith("about:") || u.startsWith("blob:") || u.startsWith("data:");
            const openOutside = (u) => { if (/^(https?|whatsapp|tel|mailto):/i.test(u)) shell.openExternal(u); };

            function createWindow() {
              win = new BrowserWindow({
                width: 1280,
                height: 800,
                minWidth: 900,
                minHeight: 600,
                title: "KARNI",
                icon: path.join(__dirname, "icon.png"),
                autoHideMenuBar: true,
                webPreferences: {
                  nodeIntegration: false,
                  contextIsolation: true,
                  preload: path.join(__dirname, "electron-preload.js")
                }
              });

              win.on("close", (e) => {
                if (allowClose) return;
                e.preventDefault();
                if (asking) return;
                asking = true;
                askExit().catch(() => {}).finally(() => { asking = false; });
              });

              let fellBack = false;
              win.webContents.on("did-fail-load", (e, code, desc, url, isMain) => {
                if (code === -3 || !isMain || fellBack || !url.startsWith(LIVE)) return;
                fellBack = true;
                win.loadFile(path.join(__dirname, "index.html"));
              });

              win.webContents.setWindowOpenHandler(({ url }) => {
                if (isInternal(url)) return { action: "allow" };
                openOutside(url);
                return { action: "deny" };
              });
              win.webContents.on("will-navigate", (e, url) => {
                if (!isInternal(url)) { e.preventDefault(); openOutside(url); }
              });

              win.loadURL(LIVE);
            }

            app.on("second-instance", () => {
              if (win) { if (win.isMinimized()) win.restore(); win.focus(); }
            });
            app.whenReady().then(createWindow);
            app.on("window-all-closed", () => {
              if (process.platform !== "darwin") app.quit();
            });
          }

          function electronPreload() {
            const { contextBridge, ipcRenderer } = require("electron");
            contextBridge.exposeInMainWorld("karniDesktop", {
              printPage: () => ipcRenderer.invoke("karni-print-page"),
              printHtml: (html, title) => ipcRenderer.invoke("karni-print-html", html, title),
              printSized: (html, title, w, h, device) => ipcRenderer.invoke("karni-print-sized", html, title, w, h, device),
              listPrinters: () => ipcRenderer.invoke("karni-printers")
            });
          }

          async function setup() {
            fs.mkdirSync("app", { recursive: true });

            const exclude = new Set(["app", "node_modules", ".git", ".github", "dist", "android-signing", "android-icons", "package.json", "package-lock.json"]);
            for (const item of fs.readdirSync(".")) {
              if (!exclude.has(item)) {
                fs.cpSync(item, path.join("app", item), { recursive: true });
              }
            }

            fs.writeFileSync("app/electron-main.js", "(" + electronMain.toString() + ")();");
            fs.writeFileSync("app/electron-preload.js", "(" + electronPreload.toString() + ")();");

            const appPkg = {
              name: "karni",
              productName: "KARNI",
              version: "1.0.0",
              description: "KARNI Financial Management Desktop Application",
              author: "Yasser Boukhchem",
              main: "electron-main.js"
            };
            fs.writeFileSync("app/package.json", JSON.stringify(appPkg, null, 2));

            let hasIco = false;
            try {
              const pngBuffer = await sharp("icon-512.png").resize(256, 256).ensureAlpha().png().toBuffer();
              fs.writeFileSync("app/icon.png", pngBuffer);

              const icoHeader = Buffer.alloc(22);
              icoHeader.writeUInt16LE(0, 0);
              icoHeader.writeUInt16LE(1, 2);
              icoHeader.writeUInt16LE(1, 4);
              icoHeader.writeUInt8(0, 6);
              icoHeader.writeUInt8(0, 7);
              icoHeader.writeUInt8(0, 8);
              icoHeader.writeUInt8(0, 9);
              icoHeader.writeUInt16LE(1, 10);
              icoHeader.writeUInt16LE(32, 12);
              icoHeader.writeUInt32LE(pngBuffer.length, 14);
              icoHeader.writeUInt32LE(22, 18);

              fs.writeFileSync("build-icon.ico", Buffer.concat([icoHeader, pngBuffer]));
              hasIco = true;
            } catch (err) {
              console.warn("Icon conversion skipped:", err.message);
            }

            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            rootPkg.name = "karni-builder";
            rootPkg.private = true;
            rootPkg.build = {
              appId: "com.yasser.karni.desktop",
              productName: "KARNI",
              npmRebuild: false,
              directories: {
                app: "app",
                output: "dist"
              },
              win: {
                target: ["nsis"],
                artifactName: "KARNI-Setup.exe"
              },
              nsis: {
                oneClick: false,
                allowToChangeInstallationDirectory: true,
                createDesktopShortcut: true,
                createStartMenuShortcut: true,
                shortcutName: "KARNI"
              }
            };
            if (hasIco) {
              rootPkg.build.win.icon = "build-icon.ico";
            }
            fs.writeFileSync("package.json", JSON.stringify(rootPkg, null, 2));
          }

          setup().catch(err => { console.error(err); process.exit(1); });
          '

      - name: 5. بناء ملف التثبيت للويندوز (KARNI-Setup.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win nsis --x64 --publish never

      - name: 6. رفع برنامج الويندوز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Windows-EXE
          path: dist/*.exe

      - name: 7. نشر المثبّت في Releases (رابط تنزيل ثابت)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "KARNI - أحدث إصدار" --notes "أحدث ملفات التثبيت: KARNI-App.apk (أندرويد) و KARNI-Setup.exe (ويندوز)" || true
          gh release upload latest dist/KARNI-Setup.exe --clobber
