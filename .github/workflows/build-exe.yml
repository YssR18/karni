name: Build KARNI Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/build-exe.yml"
      - "icon-*.png"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. تثبيت أدوات بناء الويندوز
        run: |
          npm init -y
          npm install --save-dev electron@32 electron-builder@25 sharp

      - name: 4. عزل ملفات التطبيق وتحويل الأيقونة إلى صيغة ICO للويندوز
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");

          function electronMain() {
            const { app, BrowserWindow, shell } = require("electron");
            const path = require("path");
            const LIVE = "https://yssr18.github.io/karni/";

            if (!app.requestSingleInstanceLock()) { app.quit(); return; }
            let win = null;

            const isInternal = (u) => u.startsWith(LIVE) || u.startsWith("file://") || u.startsWith("about:") || u.startsWith("blob:") || u.startsWith("data:");
            const openOutside = (u) => { if (/^(https?|whatsapp|tel|mailto):/i.test(u)) shell.openExternal(u); };

            function createWindow() {
              win = new BrowserWindow({
                width: 1280,
                height: 800,
                minWidth: 900,
                minHeight: 600,
                title: "KARNI",
                icon: path.join(__dirname, "icon.png"),
                autoHideMenuBar: true,
                webPreferences: {
                  nodeIntegration: false,
                  contextIsolation: true
                }
              });

              let fellBack = false;
              win.webContents.on("did-fail-load", (e, code, desc, url, isMain) => {
                if (code === -3 || !isMain || fellBack || !url.startsWith(LIVE)) return;
                fellBack = true;
                win.loadFile(path.join(__dirname, "index.html"));
              });

              win.webContents.setWindowOpenHandler(({ url }) => {
                if (isInternal(url)) return { action: "allow" };
                openOutside(url);
                return { action: "deny" };
              });
              win.webContents.on("will-navigate", (e, url) => {
                if (!isInternal(url)) { e.preventDefault(); openOutside(url); }
              });

              win.loadURL(LIVE);
            }

            app.on("second-instance", () => {
              if (win) { if (win.isMinimized()) win.restore(); win.focus(); }
            });
            app.whenReady().then(createWindow);
            app.on("window-all-closed", () => {
              if (process.platform !== "darwin") app.quit();
            });
          }

          async function setup() {
            fs.mkdirSync("app", { recursive: true });

            const exclude = new Set(["app", "node_modules", ".git", ".github", "dist", "android-signing", "package.json", "package-lock.json"]);
            for (const item of fs.readdirSync(".")) {
              if (!exclude.has(item)) {
                fs.cpSync(item, path.join("app", item), { recursive: true });
              }
            }

            fs.writeFileSync("app/electron-main.js", "(" + electronMain.toString() + ")();");

            const appPkg = {
              name: "karni",
              productName: "KARNI",
              version: "1.0.0",
              description: "KARNI Financial Management Desktop Application",
              author: "Yasser Boukhchem",
              main: "electron-main.js"
            };
            fs.writeFileSync("app/package.json", JSON.stringify(appPkg, null, 2));

            let hasIco = false;
            try {
              const pngBuffer = await sharp("icon-512.png").resize(256, 256).ensureAlpha().png().toBuffer();
              fs.writeFileSync("app/icon.png", pngBuffer);

              const icoHeader = Buffer.alloc(22);
              icoHeader.writeUInt16LE(0, 0);
              icoHeader.writeUInt16LE(1, 2);
              icoHeader.writeUInt16LE(1, 4);
              icoHeader.writeUInt8(0, 6);
              icoHeader.writeUInt8(0, 7);
              icoHeader.writeUInt8(0, 8);
              icoHeader.writeUInt8(0, 9);
              icoHeader.writeUInt16LE(1, 10);
              icoHeader.writeUInt16LE(32, 12);
              icoHeader.writeUInt32LE(pngBuffer.length, 14);
              icoHeader.writeUInt32LE(22, 18);

              fs.writeFileSync("build-icon.ico", Buffer.concat([icoHeader, pngBuffer]));
              hasIco = true;
            } catch (err) {
              console.warn("Icon conversion skipped:", err.message);
            }

            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            rootPkg.name = "karni-builder";
            rootPkg.private = true;
            rootPkg.build = {
              appId: "com.yasser.karni.desktop",
              productName: "KARNI",
              npmRebuild: false,
              directories: {
                app: "app",
                output: "dist"
              },
              win: {
                target: ["nsis"],
                artifactName: "KARNI-Setup.exe"
              },
              nsis: {
                oneClick: false,
                allowToChangeInstallationDirectory: true,
                createDesktopShortcut: true,
                createStartMenuShortcut: true,
                shortcutName: "KARNI"
              }
            };
            if (hasIco) {
              rootPkg.build.win.icon = "build-icon.ico";
            }
            fs.writeFileSync("package.json", JSON.stringify(rootPkg, null, 2));
          }

          setup().catch(err => { console.error(err); process.exit(1); });
          '

      - name: 5. بناء ملف التثبيت للويندوز (KARNI-Setup.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win nsis --x64 --publish never

      - name: 6. رفع برنامج الويندوز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Windows-EXE
          path: dist/*.exe

      - name: 7. نشر المثبّت في Releases (رابط تنزيل ثابت)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "KARNI - أحدث إصدار" --notes "أحدث ملفات التثبيت: KARNI-App.apk (أندرويد) و KARNI-Setup.exe (ويندوز)" || true
          gh release upload latest dist/KARNI-Setup.exe --clobber
