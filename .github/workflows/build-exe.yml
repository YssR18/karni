name: Build KARNI Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. تثبيت أدوات بناء سطح المكتب ومعالج الأيقونات
        run: |
          npm init -y
          npm install --save-dev electron@32 electron-builder@25 sharp

      - name: 4. تجهيز نافذة البرنامج وضبط أيقونة KARNI للويندوز
        run: |
          node -e '
          const fs = require("fs");
          const sharp = require("sharp");

          async function setup() {
            await sharp("icon-512.png").resize(512, 512).png().toFile("app-icon.png");

            const mainScript = `
          const { app, BrowserWindow, shell } = require("electron");
          const path = require("path");

          function createWindow() {
            const mainWindow = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 900,
              minHeight: 600,
              title: "KARNI",
              icon: path.join(__dirname, "app-icon.png"),
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            mainWindow.loadFile("index.html");

            mainWindow.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith("https://wa.me") || url.startsWith("https://api.whatsapp.com") || url.startsWith("whatsapp://")) {
                shell.openExternal(url);
                return { action: "deny" };
              }
              return { action: "allow" };
            });
          }

          app.whenReady().then(createWindow);
          app.on("window-all-closed", () => {
            if (process.platform !== "darwin") app.quit();
          });
          `;
            fs.writeFileSync("electron-main.js", mainScript.trim());

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "karni-desktop";
            pkg.productName = "KARNI";
            pkg.version = "1.0.0";
            pkg.description = "KARNI Financial Management Desktop Application";
            pkg.author = "Yasser Boukhchem";
            pkg.main = "electron-main.js";
            pkg.build = {
              appId: "com.yasser.karni.desktop",
              productName: "KARNI",
              files: [
                "**/*",
                "!android/**",
                "!www/**",
                "!.git/**",
                "!.github/**",
                "!dist/**"
              ],
              win: {
                target: ["nsis"],
                icon: "app-icon.png",
                artifactName: "KARNI-Setup.exe"
              },
              nsis: {
                oneClick: false,
                allowToChangeInstallationDirectory: true,
                createDesktopShortcut: true,
                createStartMenuShortcut: true,
                shortcutName: "KARNI"
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          }

          setup().catch(err => { console.error(err); process.exit(1); });
          '

      - name: 5. بناء ملف التثبيت للويندوز (KARNI-Setup.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win --x64

      - name: 6. رفع برنامج الويندوز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Windows-EXE
          path: dist/KARNI-Setup.exe
