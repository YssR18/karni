name: Build KARNI Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. تجهيز نافذة سطح المكتب وأيقونة KARNI
        run: |
          cat << 'EOF' > electron-main.js
          const { app, BrowserWindow, shell } = require('electron');
          const path = require('path');

          function createWindow() {
            const mainWindow = new BrowserWindow({
              width: 1280,
              height: 800,
              minWidth: 900,
              minHeight: 600,
              title: "KARNI",
              icon: path.join(__dirname, 'icon-512.png'),
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            mainWindow.loadFile('index.html');

            // فتح روابط واتساب والروابط الخارجية في المتصفح مع السماح بنوافذ الطباعة
            mainWindow.webContents.setWindowOpenHandler(({ url }) => {
              if (url.startsWith('https://wa.me') || url.startsWith('https://api.whatsapp.com') || url.startsWith('whatsapp://')) {
                shell.openExternal(url);
                return { action: 'deny' };
              }
              return { action: 'allow' };
            });
          }

          app.whenReady().then(() => {
            createWindow();
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow();
            });
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          EOF

          cat << 'EOF' > package.json
          {
            "name": "karni-desktop",
            "productName": "KARNI",
            "version": "1.0.0",
            "description": "KARNI Financial & Debt Management Desktop Application",
            "author": "Yasser Boukhchem",
            "main": "electron-main.js",
            "build": {
              "appId": "com.yasser.karni.desktop",
              "productName": "KARNI",
              "win": {
                "target": [
                  "nsis"
                ],
                "icon": "icon-512.png"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "shortcutName": "KARNI",
                "artifactName": "KARNI-Setup.exe"
              }
            }
          }
          EOF

      - name: 4. بناء ملف التثبيت للويندوز (KARNI-Setup.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm install --save-dev electron@32 electron-builder@25
          npx electron-builder --win --x64

      - name: 5. رفع برنامج الويندوز للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Windows-EXE
          path: dist/KARNI-Setup.exe
