name: Build KARNI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "icon-*.png"
      - "android-signing/**"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. إعداد بيئة Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. تجهيز غلاف أندرويد (يفتح الموقع الحي فيتحدّث تلقائياً)
        run: |
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://yssr18.github.io/karni/"><title>KARNI</title>' > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yasser.karni",
            "appName": "KARNI",
            "webDir": "www",
            "server": {
              "url": "https://yssr18.github.io/karni/",
              "cleartext": false
            }
          }
          EOF
          npx cap add android

      - name: 5. تركيب أيقونة KARNI الرسمية للتطبيق
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon-512.png "$dir/ic_launcher.png"
              cp icon-maskable-512.png "$dir/ic_launcher_round.png"
              cp icon-maskable-512.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: 6. تثبيت مفتاح التوقيع الثابت (ليُحدَّث التطبيق فوق النسخة القديمة)
        env:
          KS_B64: ${{ secrets.KARNI_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using secret keystore"
          else
            cp android-signing/debug.keystore ~/.android/debug.keystore
            echo "Using repo keystore"
          fi

      - name: 7. بناء ملف التطبيق القابل للتثبيت (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../KARNI-App.apk

      - name: 8. رفع ملف APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Android-APK
          path: KARNI-App.apk

      - name: 9. نشر APK في Releases (رابط تنزيل ثابت)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "KARNI - أحدث إصدار" --notes "أحدث ملفات التثبيت: KARNI-App.apk (أندرويد) و KARNI-Setup.exe (ويندوز)" || true
          gh release upload latest KARNI-App.apk --clobber
