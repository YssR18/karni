name: Build KARNI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. إعداد بيئة Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. إعداد Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. تحويل ملفات الويب إلى تطبيق أندرويد أصلي عبر Capacitor
        run: |
          mkdir -p www
          find . -maxdepth 1 -not -name 'www' -not -name '.git' -not -name '.github' -not -name '.' -exec cp -r {} www/ \;
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "KARNI" "com.yasser.karni" --web-dir www
          npx cap add android

      - name: 6. بناء ملف التطبيق القابل للتثبيت (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../KARNI-App.apk

      - name: 7. رفع ملف APK ليكون جاهزاً للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Android-APK
          path: KARNI-App.apk
