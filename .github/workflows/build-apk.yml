name: Build KARNI Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. إعداد بيئة Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. تجهيز ملفات الويب وتحويلها إلى أندرويد
        run: |
          mkdir -p www
          rsync -a --exclude='www' --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='android' ./ www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yasser.karni",
            "appName": "KARNI",
            "webDir": "www"
          }
          EOF
          npx cap add android

      - name: 5. تركيب أيقونة KARNI الرسمية للتطبيق
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp icon-512.png "$dir/ic_launcher.png"
              cp icon-maskable-512.png "$dir/ic_launcher_round.png"
              cp icon-maskable-512.png "$dir/ic_launcher_foreground.png"
            fi
          done

      - name: 6. بناء ملف التطبيق القابل للتثبيت (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../KARNI-App.apk

      - name: 7. رفع ملف APK للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Android-APK
          path: KARNI-App.apk
