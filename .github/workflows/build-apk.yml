name: Build KARNI Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - ".github/workflows/build-apk.yml"
      - "icon-*.png"
      - "android-icons/**"
      - "android-signing/**"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 1. جلب ملفات مشروع KARNI
        uses: actions/checkout@v4

      - name: 2. إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. إعداد بيئة Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. تجهيز غلاف أندرويد (يفتح الموقع الحي فيتحدّث تلقائياً)
        run: |
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://yssr18.github.io/karni/"><title>KARNI</title>' > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.yasser.karni",
            "appName": "KARNI",
            "webDir": "www",
            "server": {
              "url": "https://yssr18.github.io/karni/",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-feature android:name="android.hardware.bluetooth" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "BLUETOOTH" android/app/src/main/AndroidManifest.xml

      - name: 5. تركيب أيقونة KARNI بحواف دائرية + دعم الطباعة على أندرويد
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p android/app/src/main/res/mipmap-$d
            cp android-icons/mipmap-$d/ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp android-icons/mipmap-$d/ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          cat << 'EOF' > android/app/src/main/java/com/yasser/karni/MainActivity.java
          package com.yasser.karni;

          import android.Manifest;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.util.Base64;
          import java.io.OutputStream;
          import java.util.Set;
          import java.util.UUID;
          import android.os.Bundle;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private WebView printView;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new KarniAndroid(), "KarniAndroid");
              }

              public class KarniAndroid {

                  private boolean btPermOk() {
                      if (Build.VERSION.SDK_INT >= 31) {
                          if (checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      requestPermissions(new String[] { Manifest.permission.BLUETOOTH_CONNECT }, 7);
                                  }
                              });
                              return false;
                          }
                      }
                      return true;
                  }

                  @JavascriptInterface
                  public String btList() {
                      try {
                          if (!btPermOk()) return "PERM";
                          BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                          if (ad == null) return "ERR no bluetooth";
                          StringBuilder sb = new StringBuilder("[");
                          Set<BluetoothDevice> set = ad.getBondedDevices();
                          boolean first = true;
                          for (BluetoothDevice d : set) {
                              if (!first) sb.append(",");
                              first = false;
                              String n = d.getName() == null ? "" : d.getName().replace("\\", "").replace("\"", "");
                              sb.append("{\"name\":\"").append(n).append("\",\"address\":\"").append(d.getAddress()).append("\"}");
                          }
                          sb.append("]");
                          return sb.toString();
                      } catch (Exception e) {
                          return "ERR " + e.getMessage();
                      }
                  }

                  @JavascriptInterface
                  public String btPrint(String address, String b64) {
                      BluetoothSocket sock = null;
                      try {
                          if (!btPermOk()) return "ERR permission";
                          BluetoothAdapter ad = BluetoothAdapter.getDefaultAdapter();
                          if (ad == null) return "ERR no bluetooth";
                          BluetoothDevice dev = ad.getRemoteDevice(address);
                          try { ad.cancelDiscovery(); } catch (Exception ce) {}
                          UUID spp = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
                          try {
                              sock = dev.createRfcommSocketToServiceRecord(spp);
                              sock.connect();
                          } catch (Exception e1) {
                              try { if (sock != null) sock.close(); } catch (Exception e2) {}
                              sock = dev.createInsecureRfcommSocketToServiceRecord(spp);
                              sock.connect();
                          }
                          OutputStream os = sock.getOutputStream();
                          byte[] data = Base64.decode(b64, Base64.DEFAULT);
                          int off = 0;
                          while (off < data.length) {
                              int n = Math.min(2048, data.length - off);
                              os.write(data, off, n);
                              off += n;
                              Thread.sleep(8);
                          }
                          os.flush();
                          Thread.sleep(800);
                          return "OK";
                      } catch (Exception e) {
                          return "ERR " + e.getMessage();
                      } finally {
                          try { if (sock != null) sock.close(); } catch (Exception e3) {}
                      }
                  }
                  @JavascriptInterface
                  public void printHtml(final String html, final String title) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              final String name = (title == null || title.length() == 0) ? "KARNI" : title;
                              printView = new WebView(MainActivity.this);
                              printView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public void onPageFinished(WebView view, String url) {
                                      PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                      PrintDocumentAdapter adapter = view.createPrintDocumentAdapter(name);
                                      pm.print(name, adapter, new PrintAttributes.Builder().build());
                                  }
                              });
                              printView.loadDataWithBaseURL("https://yssr18.github.io/karni/", html, "text/html", "UTF-8", null);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void printSized(final String html, final String title, final int wMm, final int hMm) {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              final String name = (title == null || title.length() == 0) ? "KARNI" : title;
                              printView = new WebView(MainActivity.this);
                              printView.setWebViewClient(new WebViewClient() {
                                  @Override
                                  public void onPageFinished(final WebView view, String url) {
                                      view.postDelayed(new Runnable() {
                                          @Override
                                          public void run() {
                                              int wMil = Math.round(wMm * 1000f / 25.4f);
                                              int hMil = hMm > 0 ? Math.round(hMm * 1000f / 25.4f) : Math.max(1500, Math.round(view.getContentHeight() * 1000f / 96f) + 200);
                                              PrintAttributes attrs = new PrintAttributes.Builder()
                                                  .setMediaSize(new PrintAttributes.MediaSize("KARNI_" + wMm + "x" + hMm, "KARNI " + wMm + "mm", wMil, hMil))
                                                  .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                                  .build();
                                              PrintManager pm = (PrintManager) getSystemService(Context.PRINT_SERVICE);
                                              pm.print(name, view.createPrintDocumentAdapter(name), attrs);
                                          }
                                      }, 350);
                                  }
                              });
                              printView.loadDataWithBaseURL("https://yssr18.github.io/karni/", html, "text/html", "UTF-8", null);
                          }
                      });
                  }
              }
          }
          EOF

      - name: 6. تثبيت مفتاح التوقيع الثابت (ليُحدَّث التطبيق فوق النسخة القديمة)
        env:
          KS_B64: ${{ secrets.KARNI_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Using secret keystore"
          else
            cp android-signing/debug.keystore ~/.android/debug.keystore
            echo "Using repo keystore"
          fi

      - name: 7. بناء ملف التطبيق القابل للتثبيت (APK)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          mv app/build/outputs/apk/debug/app-debug.apk ../KARNI-App.apk

      - name: 8. رفع ملف APK كـ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KARNI-Android-APK
          path: KARNI-App.apk

      - name: 9. نشر APK في Releases (رابط تنزيل ثابت)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "KARNI - أحدث إصدار" --notes "أحدث ملفات التثبيت: KARNI-App.apk (أندرويد) و KARNI-Setup.exe (ويندوز)" || true
          gh release upload latest KARNI-App.apk --clobber
