<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر الحسابات البسيط</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- خط Cairo العربي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%D8%AF%D9%81%D8%AA%D8%B1%20%D8%A7%D9%84%D8%AD%D8%B3%D8%A7%D8%A8%D8%A7%D8%AA%20%D8%A7%D9%84%D8%A8%D8%B3%D9%8A%D8%B7%22%2C%22short_name%22%3A%22%D8%AF%D9%81%D8%AA%D8%B1%20%D8%A7%D9%84%D8%AD%D8%B3%D8%A7%D8%A8%D8%A7%D8%AA%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%230f172a%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F2654%2F2654280.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

    <style>
        body { font-family: 'Cairo', sans-serif; }
        @media print {
            body * { visibility: hidden; }
            #printable-report, #printable-report * { visibility: visible; }
            #printable-report { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
            @page { size: auto; margin: 10mm; }
            #printable-report, #printable-report * {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">(هم يدينون لي / ديون لي عندهم)</p>
                        </div>
                        <div class="text-3xl bg-blue-50 dark:bg-slate-700 p-3 rounded-xl text-blue-600 dark:text-blue-400">👥</div>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                            <span>إجمالي المبالغ المستحقة لي:</span>
                            <button onclick="event.stopPropagation(); toggleBalanceVisibility()" class="text-slate-600 dark:text-slate-300 hover:text-slate-900 focus:outline-none p-1">
                                <span id="eye-icon-cust">👁️</span>
                            </button>
                        </div>
                        <div id="total-customers-balance" class="text-2xl font-bold text-blue-600 dark:text-blue-400">****</div>
                    </div>
                </div>

                <!-- بطاقة الموردين -->
                <div onclick="openSection('suppliers')" class="bg-white dark:bg-slate-800 border-2 border-emerald-500/20 hover:border-emerald-500 rounded-2xl p-6 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between h-56 group">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="inline-block px-3 py-1 bg-emerald-100 dark:bg-emerald-900/50 text-emerald-800 dark:text-emerald-300 rounded-full text-xs font-bold mb-2">قسم الموردين</span>
                            <h3 class="text-2xl font-bold text-slate-800 dark:text-slate-100 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition">الموردون</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">(أنا أدين لهم / ديون عليّ لهم)</p>
                        </div>
                        <div class="text-3xl bg-emerald-50 dark:bg-slate-700 p-3 rounded-xl text-emerald-600 dark:text-emerald-400">🚚</div>
                    </div>
                    <div>
                        <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                            <span>إجمالي المبالغ المطلوبة مني:</span>
                            <button onclick="event.stopPropagation(); toggleBalanceVisibility()" class="text-slate-600 dark:text-slate-300 hover:text-slate-900 focus:outline-none p-1">
                                <span id="eye-icon-supp">👁️</span>
                            </button>
                        </div>
                        <div id="total-suppliers-balance" class="text-2xl font-bold text-emerald-600 dark:text-emerald-400">****</div>
                    </div>
                </div>

                <!-- بطاقة الإعدادات -->
                <div onclick="openSettingsModal()" class="bg-white dark:bg-slate-800 border-2 border-slate-500/20 hover:border-slate-500 rounded-2xl p-6 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between h-56 group">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="inline-block px-3 py-1 bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-full text-xs font-bold mb-2">الإعدادات</span>
                            <h3 class="text-2xl font-bold text-slate-800 dark:text-slate-100 group-hover:text-slate-600 dark:group-hover:text-slate-300 transition">إعدادات النظام</h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">(اسم المحل، المظهر، خيارات العملة)</p>
                        </div>
                        <div class="text-3xl bg-slate-50 dark:bg-slate-700 p-3 rounded-xl text-slate-600 dark:text-slate-300">⚙️</div>
                    </div>
                    <div>
                        <div class="text-xs text-slate-400">اسم النشاط الحالي:</div>
                        <div id="home-shop-name" class="text-sm font-bold text-slate-700 dark:text-slate-200 truncate">إسم المحل أو النشاط</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 2. شاشة القائمة (عملاء / موردين) -->
        <section id="screen-list" class="hidden space-y-4">
            <div class="flex items-center justify-between border-b dark:border-slate-800 pb-4">
                <div class="flex items-center gap-3">
                    <button onclick="showScreen('home')" class="p-2 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg text-slate-700 dark:text-slate-200 transition">← العودة</button>
                    <h2 id="list-title" class="text-2xl font-bold text-slate-800 dark:text-slate-100">---</h2>
                </div>
                <button onclick="openAddModal()" id="btn-add-person" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center gap-2">
            </div>

            <div class="bg-slate-900 text-white rounded-2xl p-5 flex justify-between items-center shadow-lg">
                <div>
                    <h2 id="person-name" class="text-xl font-bold">---</h2>
                    <p id="person-phone" class="text-xs text-slate-400 mt-1">---</p>
                    <div class="text-xs text-slate-400 mt-3" id="balance-label">الرصيد الحالي</div>
                    <div id="person-balance" class="text-3xl font-bold mt-0.5">0</div>
                </div>
                <button onclick="openTransactionModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-xl transition shadow">
                    + تسجيل حركة جديدة
                </button>
            </div>

            <h3 class="font-bold text-slate-700 dark:text-slate-300 mt-6">سجل المعاملات:</h3>
            <div id="transactions-container" class="space-y-2">
                <!-- تعبئة السجل -->
            </div>
        </section>

    </main>

    <!-- منطقة التقرير القابل للطباعة فقط -->
    <div id="printable-report" class="hidden p-6 bg-white text-slate-900 dir-rtl">
        <div class="text-center border-b pb-4 mb-4">
            <h1 id="rpt-shop-title" class="text-2xl md:text-3xl font-bold text-slate-900">إسم المحل أو النشاط</h1>
            <div class="flex justify-between items-center mt-3 text-xs text-slate-500">
                <span id="rpt-type" class="text-xl font-bold text-slate-900">كشف حساب</span>
                <span>تاريخ التقرير: <span id="rpt-date">--/--/----</span></span>
            </div>
        </div>

                        if(btn) btn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }

        // --- 3. حالة التطبيق ---
        let state = {
            activeSection: 'customers',
            currentPersonId: null,
            hideBalance: true,
            showCurrency: localStorage.getItem('app_show_currency') !== 'false',
            customers: JSON.parse(localStorage.getItem('app_customers') || '[]'),
            suppliers: JSON.parse(localStorage.getItem('app_suppliers') || '[]')
        };

        function initThemeAndConfig() {
            const isDark = localStorage.getItem('app_dark_mode') === 'true';
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateHomeShopNameDisplay();
        }

        function toggleDarkMode(enabled) {
            if (enabled) {
                document.documentElement.classList.add('dark');
                localStorage.setItem('app_dark_mode', 'true');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('app_dark_mode', 'false');
            }
            document.getElementById('list-title').innerText = isCustomer ? 'قسم العملاء' : 'قسم الموردين';
            document.getElementById('btn-add-text').innerText = isCustomer ? 'إضافة عميل' : 'إضافة مورد';
            
            const btn = document.getElementById('btn-add-person');
            btn.className = isCustomer 
                ? 'bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center gap-2'
                : 'bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl font-bold shadow transition flex items-center gap-2';

            renderPeopleList();
            showScreen('list');
        }

        function openSettingsModal() {
            document.getElementById('input-shop-name').value = localStorage.getItem('app_shop_name') || 'إسم المحل أو النشاط';
            document.getElementById('input-dark-mode').checked = localStorage.getItem('app_dark_mode') === 'true';
            document.getElementById('input-show-currency').checked = state.showCurrency;
            document.getElementById('modal-settings').classList.remove('hidden');
        }

        function saveSettings(e) {
            e.preventDefault();
            const shopName = document.getElementById('input-shop-name').value.trim() || 'إسم المحل أو النشاط';
            localStorage.setItem('app_shop_name', shopName);

            state.showCurrency = document.getElementById('input-show-currency').checked;
            localStorage.setItem('app_show_currency', state.showCurrency);

            updateHomeShopNameDisplay();
            updateHomeTotals();
            closeModal('modal-settings');
        }

        function renderPeopleList() {
            document.getElementById('modal-transaction').classList.remove('hidden');
        }

        async function deleteTransaction(txId) {
            if (!confirm('هل أنت متأكد من رغبتك في حذف هذه المعاملة؟')) return;

            const person = state[state.activeSection].find(p => p.id === state.currentPersonId);
            if (!person) return;

            const updatedTx = (person.transactions || []).filter(t => t.id != txId);

            if (db) {
                await db.collection(state.activeSection).doc(person.id).update({
                    transactions: updatedTx
                });
            } else {
                person.transactions = updatedTx;
                localStorage.setItem(`app_${state.activeSection}`, JSON.stringify(state[state.activeSection]));
                renderTransactions(person);
                updateHomeTotals();
            }
        }

        // --- 8. طباعة التقرير ---
        function printReport() {
            const person = state[state.activeSection].find(p => p.id === state.currentPersonId);
            if (!person) return;

            const isCust = state.activeSection === 'customers';
            document.getElementById('rpt-shop-title').innerText = localStorage.getItem('app_shop_name') || 'إسم المحل أو النشاط';
            document.getElementById('rpt-type').innerText = isCust ? 'كشف حساب عميل' : 'كشف حساب مورد';
            document.getElementById('rpt-date').innerText = new Date().toLocaleDateString('en-GB');
            document.getElementById('rpt-name').innerText = person.name;
            document.getElementById('rpt-details').innerText = `هاتف: ${person.phone || 'غير مدون'} | عنوان: ${person.address || 'غير مدون'}`;
                note: document.getElementById('input-tx-note').value,
                date: editTxId ? ((person.transactions || []).find(t => t.id == editTxId) || {}).date || now.toLocaleDateString('en-GB') : now.toLocaleDateString('en-GB')
            };

            let updatedTransactions = [...(person.transactions || [])];

            if (editTxId) {
                updatedTransactions = updatedTransactions.map(t => t.id == editTxId ? txData : t);
            } else {
                updatedTransactions.push(txData);
            }

            if (db) {
                await db.collection(state.activeSection).doc(person.id).update({
                    transactions: updatedTransactions
                });
            } else {
                person.transactions = updatedTransactions;
                localStorage.setItem(`app_${state.activeSection}`, JSON.stringify(state[state.activeSection]));
                renderTransactions(person);
                updateHomeTotals();
            }
            closeModal('modal-transaction');
        }

        // البدء والتهيئة
        initThemeAndConfig();
        updateHomeTotals();
        syncWithCloud();
    </script>
</body>
</html>
